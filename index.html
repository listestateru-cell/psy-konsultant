<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Психолог-консультант</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d1b18;--mute:#77716a;--acc:#b8322a}
@media (prefers-color-scheme:dark){:root{--bg:#151412;--ink:#eeeae3;--mute:#9b948a;--acc:#e0574b}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box;text-align:center}
h1 span{color:var(--acc)}p{color:var(--mute);max-width:420px}
button{font:inherit;border:1px solid var(--mute);background:none;color:var(--ink);border-radius:10px;padding:10px 18px;cursor:pointer}
</style></head><body><div><h1>Психолог-консультант <span>復習</span></h1><p id="m">Открываю…</p><p><button id="again" hidden>Попробовать ещё раз</button></p></div>
<script>
// Ключ после # не уходит на сервер GitHub. Текущий адрес приложения бот кладёт в url.txt.
// Перед переходом проверяем, что адрес жив: после сна компьютера туннель бывает мёртв,
// бот поднимает новый в течение пары минут — поэтому несколько попыток с перечитыванием url.txt.
const key = location.hash.slice(1), m = document.getElementById('m'), again = document.getElementById('again');
const RAW = 'https://api.github.com/repos/listestateru-cell/psy-konsultant/contents/url.txt';
const timeout = (ms) => new Promise((_, no) => setTimeout(() => no('timeout'), ms));
async function tryOpen(attempt) {
  again.hidden = true;
  try {
    const u = (await (await fetch(RAW + '?t=' + Date.now(), {headers: {Accept: 'application/vnd.github.raw'}, cache: 'no-store'})).text()).trim();
    if (!/^https:\/\//.test(u)) throw 'no url';
    const r = await Promise.race([fetch(u + '/healthz', {cache: 'no-store'}), timeout(8000)]);
    if (!r.ok) throw 'down';
    location.replace(u + '/u/' + key + '/');
  } catch (_) {
    if (attempt < 12) {
      m.textContent = attempt ? `Компьютер с ботом пока не отвечает, жду… (попытка ${attempt + 1} из 12)` : 'Соединяюсь…';
      setTimeout(() => tryOpen(attempt + 1), 10000);
    } else {
      m.textContent = 'Не достучался до компьютера с ботом. Скорее всего, он выключен или спит. Попробуй позже.';
      again.hidden = false;
    }
  }
}
again.onclick = () => tryOpen(0);
if (!/^[A-Za-z0-9_-]{8,}$/.test(key)) m.textContent = 'Ссылка неполная. Возьми свою в боте: кнопка «🌐 Веб-версия».';
else tryOpen(0);
</script></body></html>
