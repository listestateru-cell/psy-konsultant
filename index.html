<script>
const KEY=window.FukushuConnection?.key || location.pathname.split('/')[2], API=window.FukushuConnection?.apiBase() || '/api/'+KEY+'/';
const $=id=>document.getElementById(id);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=v=>v==null?'—':Math.round(v)+'%';
const col=v=>v==null?'var(--bar)':v>=85?'var(--ok)':v>=65?'var(--mid)':'var(--bad)';
const LV={0:'📖 термины',1:'сю · знать',2:'ха · понимать',3:'ри · применять'};
const get=p=>fetch(API+p).then(r=>{if(!r.ok)throw r.status;return r.json()}).then(homeDisplaySubjects);
const post=(p,b)=>fetch(API+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const data=await r.json();if(data.reset)studyApplyGeneration(data.generation);if(!r.ok)throw data.error||'Не получилось выполнить запрос. Попробуй ещё раз.';return data});

   :r.status=='rejected'?'Похоже, это не учебный материал по психологии, в базу не добавлен.'

 const combined=[v.baseDraft.trim(),text].filter(Boolean).join('\n');if(combined.length>20000)throw cardVoiceFault('Получилось больше 20 000 знаков. Сократи текст или запиши ответ короче.',true);
 v.session.draft=combined;delete v.session.voice;v.blob=null;v.error='';v.notice='Речь распознана. Проверь текст и нажми «Проверить мой ответ».';$('txt').value=combined;reviewPersist(v.session)}
function cardVoiceRetry(){const v=CV;if(!cardVoiceCurrent(v)||v.busy)return;v.baseDraft=v.session.draft||'';if(v.session.voice?.job){v.busy=true;v.error='';v.session.voice.baseDraft=v.baseDraft;v.session.voice.paused=false;reviewPersist(v.session);cardVoiceDraw();return cardVoiceWait(v,{pending:true,job:v.session.voice.job}).catch(err=>cardVoiceFailure(v,err)).finally(()=>{v.busy=false;if(cardVoiceCurrent(v))cardVoiceDraw()})}else return cardVoiceUpload(v)}
function cardVoiceRestore(){const s=S;if(!s?.voice?.job||CV?.session===s&&CV.busy)return;if(s.voice.card_id!==s.card?.id||s.voice.generation!==(s.generation||0)){delete s.voice;reviewPersist(s);return}const v=CV={session:s,card_id:s.voice.card_id,generation:s.voice.generation,baseDraft:typeof s.draft==='string'?s.draft:s.voice.baseDraft||'',busy:true,notice:'Продолжаю распознавание записи…'};s.voice.paused=false;cardVoiceDraw();return cardVoiceWait(v,{pending:true,job:s.voice.job}).catch(err=>cardVoiceFailure(v,err)).finally(()=>{v.busy=false;if(cardVoiceCurrent(v))cardVoiceDraw()})}

// ---------- «Объясни проще»: разговор с преподавателем ----------
let TU=null;
function tuDraw(){const t=TU,el=$('tutor');if(!t){el.hidden=true;return}el.hidden=false;
 const first=t.free&&!t.thread;
 el.innerHTML=`<div class="tutor-head"><span class="teacher-avatar" data-fx="avatar" data-state="${t.busy?'working':'idle'}" aria-hidden="true"></span><b>${e(t.title)}</b><button class="btn sm" style="flex:0 0 auto" onclick="tuClose()" aria-label="Закрыть объяснение">✕</button></div>
  ${t.msgs.map(m=>`<div class="tmsg${m.me?' me':''}">${e(m.text)}</div>`).join('')}
  ${t.busy?'<div class="tmsg hint loading-line"><span data-fx="orb" data-state="composing" aria-hidden="true"></span><span>Читаю материал и готовлю объяснение. Первый разбор большой лекции может занять несколько минут.</span></div>':''}
  ${t.thread&&!t.busy?`<div class="row"><button class="btn sm" onclick="tuAsk('other')">🔄 С другой стороны</button><button class="btn sm" onclick="tuAsk('example')">🧩 Пример</button><button class="btn sm pri" onclick="tuOk()">Понятно ✅</button></div>`:''}
  ${(t.thread||first)&&!t.busy?`<div class="row"><textarea id="tuq" rows="2" placeholder="${first?'Что непонятно?':'Свой вопрос: что именно непонятно?'}" style="flex:3 1 240px;min-height:0"></textarea><button class="btn sm" onclick="${first?'tuFirst()':'tuAsk()'}">Спросить</button></div>`:''}`;

async function explain(kind,ref,question){const t=TU={title:question||'Объясняю…',msgs:[],busy:true,thread:null};tuDraw();
 try{const r=await tuRequest(t,{op:'start',kind,ref,question});if(r){if(r.error)throw r.error;
  Object.assign(t,{thread:r.thread,title:r.title});t.msgs.push({text:r.reply})}}
 catch(err){t.msgs.push({text:typeof err=='string'?err:'Не получилось объяснить. Попробуй ещё раз.'})}

async function tuRequest(t,body){let r=await post('tutor',{...body,async:true});

 while(r.pending){if(TU!==t)return null;if(!t.job)throw 'Не удалось начать разбор. Попробуй ещё раз.';
  await new Promise(resolve=>setTimeout(resolve,1500));if(TU!==t)return null;
  r=await post('tutor',{op:'poll',job:t.job});if(r.thread)t.thread=r.thread;if(r.title)t.title=r.title;}
 return r}
async function tuAsk(mode){const t=TU;if(!t||!t.thread||t.busy)return;

 catch(err){t.msgs.push({text:typeof err=='string'?err:'Не получилось. Попробуй ещё раз.'})}

// Вкладку можно открыть ссылкой: …/u/<ключ>/#dojo
// ---------- «📝 Практика»: задания из лекций с бланками ----------
const FMT={solo:'🙋 одному',pair:'👥 в паре',either:'🙋/👥 одному или в паре',days:'📅 несколько дней'};
let TK=null,TKnav=0;
const TKdrafts=new Map();
const tkCopy=data=>JSON.parse(JSON.stringify(data||{}));
const tkError=err=>typeof err=='string'?err:'Не получилось сохранить. Проверь связь и попробуй ещё раз.';
function tkBind(task){let t=TKdrafts.get(task.id);
 if(!t){t=Object.assign(task,{_version:0,_saved:0,_revision:0,_queue:Promise.resolve(),_pending:null,_timer:null,_error:'',_actionBusy:false,_actionError:''});TKdrafts.set(t.id,t)}
 else{const keep=t._version>t._saved||t._pending||t._actionBusy,data=t.data,done=t.done,review=t.review;Object.assign(t,task);if(keep){t.data=data;t.done=done;t.review=review}}
 return t}
function tkStatus(t=TK){if(!t||TK!==t)return;const el=$('tkst');if(!el)return;
 if(t._error)el.innerHTML=`Не сохранилось: ${e(t._error)} Твои изменения остались в бланке. <button class="btn sm" onclick="tkRetry()">Сохранить ещё раз</button>`;
 else el.textContent=t._version>t._saved?'Сохраняю…':t._version?'Сохранено ✓':'Всё, что пишешь, сохраняется само.';}
function tkActionState(t=TK){if(!t||TK!==t)return;document.querySelectorAll('[data-task-action]').forEach(b=>b.disabled=!!t._actionBusy);const el=$('tkerr');if(el)el.textContent=t._actionError||''}
function tkChanged(t){t._version++;t._error='';clearTimeout(t._timer);t._timer=setTimeout(()=>{t._timer=null;tkSave(t)},700);tkStatus(t)}
function tkSave(t){clearTimeout(t._timer);t._timer=null;const version=t._version;
 if(version<=t._saved)return Promise.resolve(true);if(t._pending&&t._pending.version===version)return t._pending.promise;
 const data=tkCopy(t.data),pending={version};t._pending=pending;
 pending.promise=t._queue.then(async()=>{try{await post('task',{op:'save',id:t.id,data});t._saved=Math.max(t._saved,version);t._error='';return true}
  catch(err){t._error=tkError(err);return false}}).then(ok=>{if(t._pending===pending)t._pending=null;tkStatus(t);return ok});
 t._queue=pending.promise;return pending.promise}
async function tkFlush(t=TK){if(!t)return true;clearTimeout(t._timer);t._timer=null;
 while(t._saved<t._version){if(!await tkSave(t))return false}return true}
async function tkRetry(){await tkFlush(TK)}
async function tkBeforeNavigation(){const nav=++TKnav,t=TK;if(!await tkFlush(t)||nav!==TKnav)return null;TK=null;return nav}
async function loadPractice(subject,nav){if(nav==null)nav=await tkBeforeNavigation();if(nav==null)return;
 $('v-practice').innerHTML='<div class="box center loading-line" data-fx-busy="true" data-fx-state="searching">Загружаю…</div>';let T;
 try{T=(await get('tasks'+(subject?'?subject='+subject:''))).tasks}
 catch(_){if(nav===TKnav)$('v-practice').innerHTML='<div class="box">Не получилось открыть задания. Попробуй ещё раз.</div>';return}
 if(nav!==TKnav)return;
 if(!T.length){$('v-practice').innerHTML='<div class="box center"><p>Заданий пока нет. Бот ищет их в лекциях после разбора — загляни чуть позже.</p></div>';return}
 const done=T.filter(t=>t.done).length, groups=[];
 T.forEach(t=>{const k=t.subject+'|'+(t.lecture||'');let g=groups.find(x=>x.k==k);if(!g)groups.push(g={k,subject:t.subject,lecture:t.lecture||'Общие задания по дисциплине',items:[]});g.items.push(t)});
 let h=`<div class="box"><h2>📝 Практика: сделано ${done} из ${T.length}</h2><div class="bar"><i style="width:${Math.round(100*done/T.length)}%"></i></div>
  <p class="hint">Задания из лекций, которые нужно сделать самому. 🔴 горит, пока не нажмёшь «Готово». Бланки сохраняются сами: свой вегетативный паспорт или дневник можно открыть когда угодно.</p></div>`, subj='';
 groups.forEach(g=>{if(g.subject!=subj){subj=g.subject;h+=`<h3 style="margin:18px 0 6px">${e(subj||'')}</h3>`}
  h+=`<div class="box" style="margin-top:8px;padding:12px 14px"><b>${e(g.lecture)}</b>${g.items.map(t=>`<div class="task" onclick="openTask(${t.id})"><span>${t.done?'✅':'🔴'}</span><div><b>${e(t.title)}</b><br><small class="hint">${FMT[t.format]||''}${!t.done&&t.started?' · начато':''}</small></div></div>`).join('')}</div>`});
 $('v-practice').innerHTML=h;}
async function openTask(id){const nav=await tabOnly('practice');if(nav==null)return;$('v-practice').innerHTML='<div class="box center loading-line" data-fx-busy="true" data-fx-state="searching">Загружаю…</div>';
 const known=TKdrafts.get(id),revision=known&&known._revision;
 try{const task=await get('task?id='+id);if(nav!==TKnav)return;if(known&&known._revision!==revision){task.done=known.done;task.review=known.review}TK=tkBind(task);drawTask()}
 catch(_){if(nav===TKnav)$('v-practice').innerHTML='<div class="box">Не получилось открыть задание. Попробуй ещё раз.</div>'}}
function fieldHtml(f,id,v){
 if(f.type=='text')return `${f.hint?`<p class="hint" style="margin-top:0">${e(f.hint)}</p>`:''}<textarea data-f="${id}" oninput="tkSet()" rows="4">${e(v||'')}</textarea>`;
 if(f.type=='table'){const rows=v&&v.length?v:Array.from({length:f.rows||3},()=>[]);
  return `<div class="tblwrap"><table class="tk"><tr>${f.columns.map(c=>`<th>${e(c)}</th>`).join('')}</tr>${rows.map((r,ri)=>`<tr>${f.columns.map((c,ci)=>`<td><textarea rows="2" data-f="${id}" data-r="${ri}" data-c="${ci}" oninput="tkSet()">${e((r||[])[ci]||'')}</textarea></td>`).join('')}</tr>`).join('')}</table></div>
   <div class="row"><button class="btn sm" onclick="tkAddRow('${id}')" style="flex:0 1 160px">+ строка</button></div>`}
 if(f.type=='diary'){const rows=v||[];
  return `${rows.length?`<div class="tblwrap"><table class="tk"><tr><th>Дата</th>${f.columns.map(c=>`<th>${e(c)}</th>`).join('')}</tr>${rows.map((r,ri)=>`<tr><td><input type="date" data-f="${id}" data-r="${ri}" data-c="d" value="${e(r.date||'')}" oninput="tkSet()"></td>${f.columns.map((c,ci)=>`<td><textarea rows="2" data-f="${id}" data-r="${ri}" data-c="${ci}" oninput="tkSet()">${e((r.cells||[])[ci]||'')}</textarea></td>`).join('')}</tr>`).join('')}</table></div>`:'<p class="hint">Записей пока нет.</p>'}
   <div class="row"><button class="btn sm" onclick="tkAddRow('${id}')" style="flex:0 1 220px">+ запись за сегодня</button></div>`}
 if(f.type=='check')return f.items.map((it,i)=>`<label class="chk"><input type="checkbox" data-f="${id}" onchange="tkSet()"${v&&v[i]?' checked':''}><span>${e(it)}</span></label>`).join('');
 if(f.type=='test')return f.groups.map((g,gi)=>`<h4 style="margin:14px 0 4px">${e(g.name)}</h4>`+g.items.map((it,i)=>`<label class="chk"><input type="checkbox" data-f="${id}" data-g="g${gi}" data-i="${i}" onchange="tkSet()"${v&&v['g'+gi]&&v['g'+gi][i]?' checked':''}><span>${e(it)}</span></label>`).join('')).join('')
  +`<p class="res" id="res-${id}"></p>${f.note?`<p class="hint">${e(f.note)}</p>`:''}`;
 if(f.type=='scale')return f.items.map((it,i)=>`<div class="sc"><div>${i+1}. ${e(it)}</div><select data-f="${id}" onchange="tkSet()"><option value="">—</option>${f.options.map(o=>`<option value="${o.score}"${v&&v[i]!=null&&+v[i]===o.score?' selected':''}>${e(o.label)}</option>`).join('')}</select></div>`).join('')
  +`<p class="res" id="res-${id}"></p>${f.key?`<p class="hint">${e(f.key)}</p>`:''}`;
 return ''}
function drawTask(){const t=TK,d=t.data||{};
 let h=`<div class="box"><div class="row" style="margin:0 0 8px"><button class="btn sm" onclick="loadPractice()" style="flex:0 1 160px">← Все задания</button></div>
  <div class="meta">${e(t.subject||'')} · ${e(t.lecture||'общее задание')} · ${FMT[t.format]||''}</div>
  <h2 style="margin:6px 0">${t.done?'✅':'🔴'} ${e(t.title)}</h2>
  <details${t.done?'':' open'}><summary>Что сделать</summary><p style="white-space:pre-wrap">${e(t.instructions)}</p>${t.source?`<small class="hint">Источник: ${e(t.source)}</small>`:''}</details></div>`;
 t.blank.forEach((f,i)=>{h+=`<div class="box" style="margin-top:12px"><h3 style="margin-top:0">${e(f.label)}</h3>${fieldHtml(f,'f'+i,d['f'+i])}</div>`});
 h+=`<div class="box" style="margin-top:12px"><div class="row">${t.done?`<button class="btn" data-task-action onclick="taskDone(0)">↩️ Вернуть в несделанные</button>`:`<button class="btn pri" data-task-action onclick="taskDone(1)">✅ Готово — задание сделано</button>`}<button class="btn" data-task-action onclick="taskReview()">🧑‍🏫 Разобрать с преподавателем</button></div>
  <div id="tkst" class="hint"></div><div id="tkerr" class="hint" role="alert"></div><div id="tkrev">${tkReviewHtml(t)}</div></div>`;
 $('v-practice').innerHTML=h;tkResults();tkStatus(t);tkActionState(t)}
function tkReviewHtml(t){return t.review?`<div class="tmsg"><b>🧑‍🏫 Разбор преподавателя</b>${t._reviewStale?'<p class="hint">Этот разбор относится к предыдущей версии бланка. Для новых изменений запроси разбор ещё раз.</p>':'<br>'}${e(t.review)}</div>`:''}
function tkCollect(t=TK){if(!t||t!==TK)return tkCopy(t&&t.data);const d={};t.blank.forEach((f,i)=>{const id='f'+i,q=[...document.querySelectorAll(`[data-f="${id}"]`)];

 return d}
function tkResults(){TK.blank.forEach((f,i)=>{const id='f'+i,v=(TK.data||{})[id],el=$('res-'+id);if(!el)return;
 if(f.type=='test')el.textContent='Итог: '+f.groups.map((g,gi)=>`${g.name} — ${(((v||{})['g'+gi])||[]).filter(Boolean).length} из ${g.items.length}`).join(' · ');

async function homeTasks(){try{const T=(await get('tasks')).tasks,n=T.filter(t=>!t.done).length,el=$('hometasks');if(!el||!T.length)return;
 el.innerHTML=`<div class="box" style="padding:12px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:200px"><b>📝 Практика</b><br><small class="hint">${n?`🔴 Не сделано заданий из лекций: ${n} из ${T.length}`:`✅ Все ${T.length} заданий сделаны`}</small></div><button class="btn sm${n?' pri':''}" onclick="tab('practice')" style="flex:0 1 160px">Открыть</button></div>`}catch(_){}}
